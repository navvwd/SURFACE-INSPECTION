# ResNet18 transfer-learning configuration (Phase 4)
model:
  name: resnet18
  version: v1
  architecture: resnet18
  input_shape: [200, 200, 1]        # same raw input contract as the custom CNN
  resize_to: 224                    # ImageNet resolution, done inside the model
  pretrained_weights: models/pretrained/resnet18_imagenet_backbone.h5   # from training.port_resnet18_weights
  dropout_head: 0.3
  gradcam_layer: layer4_1_out       # output of the last residual block (7x7)

data:
  config: configs/data.yaml
  batch_size: 32
  augmentation:                     # identical policy to the custom CNN (fair comparison)
    flip_horizontal: true
    flip_vertical: true
    rot90: true
    brightness_max_delta: 0.15
    contrast_range: [0.7, 1.3]

training:
  seed: 42
  # Stage 1: train only the new classification head on frozen ImageNet features.
  # Stage 2: unfreeze layer3 + layer4 and fine-tune with a 10x lower learning rate.
  # BatchNorm layers stay in inference mode throughout (small dataset; keeps ImageNet statistics).
  stages:
    - name: head
      epochs: 8
      learning_rate: 0.001
      trainable: head
    - name: finetune
      epochs: 40
      learning_rate: 0.0001
      trainable: [layer3, layer4, head]
  optimizer: adam
  early_stopping_patience: 8
  reduce_lr_patience: 4
  reduce_lr_factor: 0.5
  min_lr: 0.000001
