# Render Blueprint: one Python web service that runs the FastAPI API and serves the website (frontend/dist).
# Deploy: Render dashboard -> New -> Blueprint -> select this repo.  (Or create a Web Service with the same values.)
services:
  - type: web
    name: coco-surfacecheck
    runtime: python
    plan: standard            # 2 GB RAM: needed to load both TensorFlow models (see README "Deploy on Render")
    buildCommand: bash scripts/render_build.sh
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
      # Smaller instances (free / starter, 512 MB): load only the custom CNN to reduce memory:
      # - key: SURFACECHECK_MODEL_DIRS
      #   value: models/custom_cnn/v1
      # - key: SURFACECHECK_DEFAULT_MODEL
      #   value: custom_cnn:v1
